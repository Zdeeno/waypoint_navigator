waypoint_follower:
  ros__parameters:
    marker_topic: "/whycode_node/markers"
    odom_topic: "/odometry_publisher"
    cmd_vel_topic: "/cmd_vel_subscriber"
    cmd_vel_frame_id: "base_link"
    path_topic: "waypoint_path"

    goal_tolerance: 0.8
    desired_linear_velocity: 3.0
    max_angular_velocity: 0.8
    angular_gain: 1.0
    waypoint_spacing: 0.5

    use_waypoint_timestamps: true
    min_linear_velocity: 1.0
    max_linear_velocity: 3.0

    # Pause motion until the integrated buffered path length (from the last
    # reached waypoint through the buffer) reaches this many meters.
    # 0.0 disables the gate; nonzero values throttle starts on short buffers.
    minimal_following_distance: 4.0
